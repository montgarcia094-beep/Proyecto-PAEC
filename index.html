<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Estructura con Columnas</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f6f7bd;
            padding: 10px 20px;
        }

        /* Estilo para controlar el tamaño fijo del logotipo pequeño */
        .logo-pequeno {
            width: 50px;
            /* Ajusta el tamaño que desees */
            height: auto;
            display: block;
        }

        /* Estilo para que la imagen de la cabecera sea responsiva y no se desborde */


        .logo-cabecera {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 15px;
            /* Espacio entre la imagen y el título */
        }
        .boton-nav {
            text-decoration: none;
            color: #e2bfff;
            background-color: bisque;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s;
        }    
        
        .boton-nav.hover {
            background-color: #f6f7bd;
        }

        .boton-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }


        main {
            display: flex;
            gap: 20px;

        }

        aside {
            width: 25%;

            background-color: #ffa7a7;
            padding: 15px;
        }


        section {
            width: 75%;
            background-color: #e2bfff;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">Mi Sitio Web</h1>
            <nav>barra de navegacion</nav>
            <a href="semantica.html" class="boton-nav activo">Inicio</a>
            <a href="semantica2.html" class="boton-nav">Servicio</a>
            <a href="semantica3.html" class="boton-nav">Contacto</a>
        <nav>
        </div>
        <img src="logo.jpg" alt="Logo de Mi Sitio Web" class="logo-cabecera">
    </header>
    <main>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Enlaces, publicidad o categorías.</p>
        </aside>
        <section>
            <article>
                <h2>Artículo Principal</h2>
                <p>Contenido del artículo...</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Pie de página</p>
    </footer>

</body>

</html>
